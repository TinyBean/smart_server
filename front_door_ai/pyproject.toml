[project]
name = "front-door-ai"
version = "1.1.12"
description = "Local Home Assistant doorway vision and reminder add-on"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "pydantic>=2.9,<3", "websockets>=15,<17", "paho-mqtt>=2.1,<3", "pillow>=11,<13",
  "numpy>=2,<3", "opencv-python-headless>=4.10,<5", "scipy>=1.14,<2",
]

[project.optional-dependencies]
vision = ["openvino>=2025,<2027", "trackers"]
voice = ["piper-tts>=1.3,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "pyyaml>=6,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a running MQTT broker", "model: requires downloaded OpenVINO model"]

[tool.uv]
# Supervision uses cv2 but declares the GUI distribution. Provide only headless cv2.
exclude-dependencies = ["opencv-python"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
