name: Front Door AI
version: "1.1.12"
slug: front_door_ai
description: 本地门口人体检测、进出事件与提前缓存的出门提醒
arch:
  - amd64
startup: application
boot: auto
init: true
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:door-open
panel_title: Front Door AI
panel_admin: true
homeassistant_api: true
ports:
  8080/tcp: 18080
ports_description:
  8080/tcp: 局域网视频代理、快照及 ESP32 音频下载
map:
  - type: addon_config
    read_only: true
    path: /config
watchdog: http://[HOST]:[PORT:8080]/healthz
backup: cold
backup_exclude:
  - events
  - reminder-cache
options:
  camera_url: ""
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_tls: false
  mqtt_prefix: home/frontdoor
  device_id: frontdoor
  public_base_url: ""
  todo_entity: todo.departure_reminders
  tts_provider: qwen
  qwen_api_key: ""
  qwen_tts_url: wss://cn-beijing.maas.qianwenaiapi.com/api-ws/v1/inference
  qwen_tts_model: qwen-audio-3.1-tts-flash
  qwen_tts_voice: longjielidou_v3.1
  piper_model: /config/piper/voice.onnx
  detector_model: /models/person-detection-retail-0013.xml
schema:
  camera_url: str
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  mqtt_tls: bool
  mqtt_prefix: str
  device_id: str
  public_base_url: str
  todo_entity: str
  tts_provider: list(piper|qwen)
  qwen_api_key: password
  qwen_tts_url: str
  qwen_tts_model: str
  qwen_tts_voice: str
  piper_model: str
  detector_model: str
