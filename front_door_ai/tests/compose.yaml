services:
  broker:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:18884:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-t", "health", "-m", "ok"]
      interval: 2s
      timeout: 2s
      retries: 10
